<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4;
            margin: 20mm;
            @top-right {
                content: "产品手册";
                font-size: 10pt;
                color: #666;
            }
            @bottom-center {
                content: "第 " counter(page) " 页";
                font-size: 10pt;
            }
        }
        
        body {
            font-family: "SimSun", "宋体", serif;
            line-height: 1.6;
            color: #333;
        }
        
        h1 {
            font-size: 24pt;
            color: #1E90FF;
            border-bottom: 2px solid #1E90FF;
            padding-bottom: 10px;
        }
        
        h2 {
            font-size: 18pt;
            color: #333;
            margin-top: 30px;
        }
        
        .safety-warning {
            border: 2px solid #FF0000;
            background: #FFEEEE;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        
        .safety-warning h3 {
            color: #FF0000;
            margin-top: 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: left;
        }
        
        th {
            background: #f0f0f0;
            font-weight: bold;
        }
        
        .cover {
            text-align: center;
            padding: 100px 0;
        }
        
        .cover h1 {
            font-size: 36pt;
            border: none;
        }
        
        .cover p {
            font-size: 18pt;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- 封面 -->
    <div class="cover">
        <h1>EVlink Pro DC 180</h1>
        <h2>充电站用户手册</h2>
        <p>型号：GEX4301000</p>
        <p>版本：v1.0</p>
        <p>日期：2024-05</p>
    </div>
    
    <!-- 安全警告 -->
    <div class="safety-warning">
        <h3>⚠️ DANGER - 危险</h3>
        <p>不避免此危险将导致死亡或重伤。</p>
        <ul>
            <li>高压电击危险 - 仅授权专业人员可操作</li>
            <li>安装前必须断开电源</li>
        </ul>
    </div>
    
    <!-- 章节 -->
    <h1>1. 产品概述</h1>
    <h2>1.1 产品简介</h2>
    <p>EVlink Pro DC 180 是一款高性能直流充电站，适用于商业和公共充电场所。</p>
    
    <h2>1.2 技术规格</h2>
    <table>
        <tr>
            <th>参数</th>
            <th>规格</th>
        </tr>
        <tr>
            <td>输入电压</td>
            <td>380V AC ±10%</td>
        </tr>
        <tr>
            <td>输出功率</td>
            <td>180kW DC</td>
        </tr>
        <tr>
            <td>工作温度</td>
            <td>-25°C ~ +50°C</td>
        </tr>
        <tr>
            <td>防护等级</td>
            <td>IP54</td>
        </tr>
    </table>
</body>
</html>
