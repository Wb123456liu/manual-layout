<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI手册排版工具 - 飞书版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; padding: 10px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { color: white; font-size: 18px; }
        .steps { display: flex; justify-content: center; margin-bottom: 10px; gap: 5px; flex-wrap: wrap; }
        .step { display: flex; align-items: center; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 15px; color: rgba(255,255,255,0.6); font-size: 10px; }
        .step-num { background: rgba(255,255,255,0.2); width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 4px; font-weight: bold; }
        .step.active { background: white; color: #1e3c72; }
        .step.active .step-num { background: #1e3c72; color: white; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .panel { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-height: 80vh; overflow-y: auto; }
        .section-title { font-size: 13px; font-weight: bold; color: #1e3c72; margin-bottom: 10px; }
        .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-primary { background: #1e3c72; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-outline { background: transparent; border: 2px solid #1e3c72; color: #1e3c72; }
        .btn-feishu { background: linear-gradient(135deg, #3370ff, #2b65e9); color: white; width: 100%; padding: 12px; }
        .btn-group { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .btn-full { width: 100%; }
        textarea { width: 100%; min-height: 150px; padding: 8px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 11px; resize: vertical; }
        input[type="text"] { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 11px; }
        .preview-box { background: #4a5568; padding: 8px; border-radius: 8px; }
        .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .preview-title { color: white; font-weight: bold; font-size: 11px; }
        .preview-badge { background: white; padding: 2px 8px; border-radius: 10px; font-size: 9px; color: #1e3c72; }
        .preview-content { background: white; padding: 10mm; min-height: 180mm; font-size: 9pt; overflow-y: auto; max-height: 70vh; }
        .status { padding: 6px; border-radius: 4px; margin: 6px 0; font-size: 10px; }
        .s-success { background: #d1fae5; color: #065f46; }
        .s-info { background: #dbeafe; color: #1e40af; }
        .s-warning { background: #fef3c7; color: #92400e; }
        .s-error { background: #fee2e2; color: #991b1b; }
        .help { font-size: 9px; color: #666; margin-top: 6px; background: #f8fafc; padding: 6px; border-radius: 4px; }
        .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin: 8px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #10b981, #059669); transition: width 0.2s; }
        .large-doc-info { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px; margin: 8px 0; }
        .large-doc-info .title { font-weight: bold; color: #1e40af; font-size: 11px; }
        .large-doc-info .stats { display: flex; gap: 15px; margin-top: 5px; font-size: 10px; color: #666; flex-wrap: wrap; }
        .settings-group { background: #f8fafc; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .settings-title { font-size: 11px; font-weight: bold; color: #1e3c72; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .setting-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 10px; }
        .setting-label { width: 70px; color: #666; }
        .setting-input { flex: 1; padding: 4px; border: 1px solid #ddd; border-radius: 3px; font-size: 10px; }
        .color-picker { display: flex; gap: 8px; margin: 8px 0; align-items: center; flex-wrap: wrap; }
        .color-picker label { font-size: 10px; min-width: 40px; }
        .color-picker input[type="color"] { width: 30px; height: 25px; border: none; cursor: pointer; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 10px; }
        .img-preview { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .img-preview-item { position: relative; width: 70px; height: 70px; }
        .img-preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; border: 2px solid #ddd; }
        .preset-templates { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
        .preset-tpl { padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 10px; }
        .preset-tpl:hover { border-color: #667eea; background: #f0f4ff; }
        .preset-tpl.selected { border-color: #667eea; background: #e0e7ff; }
        .doc-list { max-height: 200px; overflow-y: auto; margin: 10px 0; }
        .doc-item { padding: 8px; border: 1px solid #e2e8f0; border-radius: 4px; margin: 4px 0; cursor: pointer; font-size: 10px; display: flex; align-items: center; gap: 8px; }
        .doc-item:hover { background: #f0f4ff; border-color: #3370ff; }
        .doc-item.selected { background: #e0e7ff; border-color: #3370ff; }
        @media (max-width: 700px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI手册排版工具 - 飞书版</h1>
            <div style="color:rgba(255,255,255,0.7);font-size:10px;margin-top:4px;">直接导入飞书文档 · 无需上传</div>
        </div>
        <div class="steps">
            <div class="step active" id="s1"><span class="step-num">1</span>导入</div>
            <div class="step" id="s2"><span class="step-num">2</span>解析</div>
            <div class="step" id="s3"><span class="step-num">3</span>调整</div>
            <div class="step" id="s4"><span class="step-num">4</span>导出</div>
        </div>
        <div class="main-grid">
            <div class="panel">
                <div id="p1">
                    <div class="section-title">📚 步骤1: 导入飞书文档</div>
                    
                    <!-- 方式一：飞书文档链接 -->
                    <div class="settings-group">
                        <div class="settings-title">🔗 方式一：输入飞书文档链接</div>
                        <input type="text" id="docUrl" placeholder="粘贴飞书文档链接，如：https://xxx.feishu.cn/docx/xxx">
                        <div class="btn-group">
                            <button class="btn btn-feishu" onclick="importFromUrl()">📥 从链接导入</button>
                        </div>
                    </div>
                    
                    <!-- 方式二：搜索飞书文档 -->
                    <div class="settings-group">
                        <div class="settings-title">🔍 方式二：搜索飞书文档</div>
                        <input type="text" id="searchKey" placeholder="输入关键词搜索文档...">
                        <div class="btn-group">
                            <button class="btn btn-primary btn-full" onclick="searchDocs()">🔍 搜索</button>
                        </div>
                        <div class="doc-list" id="docList"></div>
                    </div>
                    
                    <!-- 方式三：上传本地文件 -->
                    <div class="settings-group">
                        <div class="settings-title">📄 方式三：上传本地文件</div>
                        <input type="file" id="localFile" accept=".docx,.pdf,.txt,.md" style="width:100%;" onchange="loadLocal(this)">
                    </div>
                    
                    <div id="importStatus"></div>
                    <div class="progress-bar" id="progressBar" style="display:none;"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
                    
                    <div class="btn-group">
                        <button class="btn btn-success btn-full" onclick="go(2)">下一步 →</button>
                    </div>
                </div>
                
                <div id="p2" style="display:none;">
                    <div class="section-title">🤖 步骤2: 内容预览</div>
                    
                    <div class="large-doc-info" id="docInfo" style="display:none;">
                        <div class="title">📊 文档信息</div>
                        <div class="stats">
                            <span>📄 字数: <strong id="charCount">0</strong></span>
                            <span>📑 章节: <strong id="sectionCount">0</strong></span>
                            <span>🖼️ 图片: <strong id="imgCount">0</strong></span>
                        </div>
                    </div>
                    
                    <div class="section-title">📝 文字内容</div>
                    <textarea id="content" oninput="onInput()"></textarea>
                    
                    <div class="section-title">🖼️ 图片 (<span id="imgNum">0</span>张)</div>
                    <div class="img-preview" id="imgPreview"></div>
                    
                    <div class="btn-group">
                        <button class="btn btn-outline" onclick="go(1)">←</button>
                        <button class="btn btn-success btn-full" onclick="go(3)">调整样式 →</button>
                    </div>
                </div>
                
                <div id="p3" style="display:none;">
                    <div class="section-title">⚙️ 步骤3: 调整样式</div>
                    
                    <div class="settings-group">
                        <div class="settings-title">🎨 模板风格</div>
                        <div class="preset-templates">
                            <div class="preset-tpl selected" onclick="selectPreset('schneider')">🔷 Schneider</div>
                            <div class="preset-tpl" onclick="selectPreset('abb')">🔶 ABB</div>
                            <div class="preset-tpl" onclick="selectPreset('siemens')">🔷 Siemens</div>
                            <div class="preset-tpl" onclick="selectPreset('default')">⬜ 默认</div>
                        </div>
                    </div>
                    
                    <div class="settings-group">
                        <div class="settings-title">🎨 颜色设置</div>
                        <div class="color-picker">
                            <label>主色:</label><input type="color" id="mainColor" value="#0066cc" onchange="render()">
                            <label>警告:</label><input type="color" id="dangerColor" value="#dc3545" onchange="render()">
                        </div>
                        <div class="setting-row">
                            <span class="setting-label">标题:</span>
                            <input type="text" class="setting-input" id="docTitle" value="产品手册" oninput="render()">
                        </div>
                    </div>
                    
                    <div class="settings-group">
                        <div class="settings-title">📄 页眉页脚</div>
                        <div class="checkbox-row"><input type="checkbox" id="showHeader" checked onchange="render()"> <label>显示页眉</label></div>
                        <div class="checkbox-row"><input type="checkbox" id="showFooter" checked onchange="render()"> <label>显示页脚</label></div>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-outline" onclick="go(2)">←</button>
                        <button class="btn btn-success btn-full" onclick="go(4)">导出 →</button>
                    </div>
                </div>
                
                <div id="p4" style="display:none;">
                    <div class="section-title">📤 步骤4: 导出</div>
                    <div class="large-doc-info">
                        <div><strong>文档:</strong> <span id="sumDoc">-</span></div>
                        <div><strong>字数:</strong> <span id="sumChar">0</span></div>
                        <div><strong>图片:</strong> <span id="sumImg">0</span>张</div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="printPDF()">🖨️ 导出PDF</button>
                        <button class="btn btn-primary" onclick="saveHTML()">💾 导出HTML</button>
                        <button class="btn btn-warning" onclick="saveToFeishu()">📚 保存到飞书</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-outline" onclick="go(3)">←</button>
                        <button class="btn btn-outline" onclick="location.reload()">🔄 重置</button>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <div class="preview-box">
                    <div class="preview-header">
                        <span class="preview-title">👁️ 实时预览</span>
                        <span class="preview-badge" id="badge">待导入</span>
                    </div>
                    <div class="preview-content" id="preview">
                        <div style="text-align:center;padding:40mm;color:#999;">请导入飞书文档</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        var $ = function(id) { return document.getElementById(id); };
        var curStep = 1, cntImgs = [], docName = '', docToken = '';
        
        var presets = {
            schneider: { main: '#0066cc', danger: '#dc3545' },
            abb: { main: '#ff6600', danger: '#dc3545' },
            siemens: { main: '#009999', danger: '#ff6600' },
            default: { main: '#333333', danger: '#dc3545' }
        };
        
        function selectPreset(name) {
            var p = presets[name];
            $('mainColor').value = p.main;
            $('dangerColor').value = p.danger;
            document.querySelectorAll('.preset-tpl').forEach(function(e) {
                e.classList.remove('selected');
            });
            event.target.classList.add('selected');
            render();
        }
        
        function go(n) {
            $('s' + curStep).className = 'step';
            $('p' + curStep).style.display = 'none';
            curStep = n;
            $('s' + curStep).className = 'step active';
            $('p' + curStep).style.display = 'block';
            if(n === 4) updateSum();
            render();
        }
        
        function showStatus(msg, cls) {
            $('importStatus').innerHTML = '<div class="status ' + cls + '">' + msg + '</div>';
        }
        
        function setProgress(pct) {
            $('progressBar').style.display = 'block';
            $('progressFill').style.width = pct + '%';
        }
        
        // ========== 方式一：从URL导入 ==========
        async function importFromUrl() {
            var url = $('docUrl').value.trim();
            if(!url) {
                showStatus('❌ 请输入飞书文档链接', 's-error');
                return;
            }
            
            // 解析文档 token
            var match = url.match(/\/(docx|doc|wiki|sheet)\/([a-zA-Z0-9]+)/);
            if(!match) {
                showStatus('❌ 无法识别的飞书文档链接', 's-error');
                return;
            }
            
            var docType = match[1];
            docToken = match[2];
            docName = '飞书文档-' + docToken;
            
            showStatus('⏳ 正在获取文档内容...', 's-info');
            setProgress(20);
            
            try {
                // 调用后端 API 获取文档内容
                var response = await fetch('/api/feishu/doc?token=' + docToken + '&type=' + docType);
                
                if(!response.ok) {
                    // 如果后端 API 不可用，使用模拟数据
                    showStatus('⚠️ API 不可用，请使用本地文件上传', 's-warning');
                    setProgress(0);
                    return;
                }
                
                var data = await response.json();
                
                $('content').value = data.content || '';
                cntImgs = data.images || [];
                docName = data.title || docName;
                
                updateStats();
                updateImgPreview();
                
                showStatus('✅ 导入成功！', 's-success');
                setProgress(100);
                setTimeout(function() { $('progressBar').style.display = 'none'; }, 500);
                
                onInput();
                
            } catch(err) {
                showStatus('❌ 导入失败: ' + err.message, 's-error');
                setProgress(0);
            }
        }
        
        // ========== 方式二：搜索飞书文档 ==========
        async function searchDocs() {
            var key = $('searchKey').value.trim();
            if(!key) {
                showStatus('❌ 请输入搜索关键词', 's-error');
                return;
            }
            
            showStatus('⏳ 正在搜索...', 's-info');
            
            try {
                var response = await fetch('/api/feishu/search?key=' + encodeURIComponent(key));
                
                if(!response.ok) {
                    // 模拟搜索结果
                    $('docList').innerHTML = '<div class="doc-item" onclick="selectDoc(\'模拟文档\', \'docx\', \'mock123\')">📄 模拟文档（示例）</div>';
                    showStatus('⚠️ API 不可用，显示示例数据', 's-warning');
                    return;
                }
                
                var data = await response.json();
                var html = '';
                (data.documents || []).forEach(function(doc) {
                    html += '<div class="doc-item" onclick="selectDoc(\'' + doc.name + '\', \'' + doc.type + '\', \'' + doc.token + '\')">📄 ' + doc.name + '</div>';
                });
                $('docList').innerHTML = html || '<div style="font-size:10px;color:#999;padding:10px;">未找到文档</div>';
                showStatus('✅ 搜索完成', 's-success');
                
            } catch(err) {
                $('docList').innerHTML = '<div class="doc-item" onclick="selectDoc(\'示例文档\', \'docx\', \'example\')">📄 示例文档（点击测试）</div>';
                showStatus('⚠️ 使用示例数据', 's-warning');
            }
        }
        
        function selectDoc(name, type, token) {
            docName = name;
            docToken = token;
            document.querySelectorAll('.doc-item').forEach(function(e) { e.classList.remove('selected'); });
            event.target.classList.add('selected');
            showStatus('✅ 已选择: ' + name, 's-success');
            
            // 自动导入
            importFromUrl();
        }
        
        // ========== 方式三：本地文件 ==========
        async function loadLocal(input) {
            var file = input.files[0];
            if(!file) return;
            
            docName = file.name;
            showStatus('⏳ 正在解析本地文件...', 's-info');
            setProgress(30);
            
            var ext = file.name.split('.').pop().toLowerCase();
            
            if(ext === 'txt' || ext === 'md') {
                var r = new FileReader();
                r.onload = function(e) {
                    $('content').value = e.target.result;
                    updateStats();
                    showStatus('✅ 解析完成', 's-success');
                    setProgress(100);
                    setTimeout(function() { $('progressBar').style.display = 'none'; }, 500);
                    onInput();
                };
                r.readAsText(file);
            } else {
                // 对于 docx/pdf，提示用户使用飞书导入或显示原始内容
                showStatus('⚠️ Word/PDF 请使用飞书文档导入，或转换为 txt/md 格式', 's-warning');
                setProgress(0);
            }
        }
        
        function updateStats() {
            var text = $('content').value;
            $('docInfo').style.display = 'block';
            $('charCount').textContent = text.length;
            $('sectionCount').textContent = (text.match(/^#+\s/gm) || []).length;
            $('imgCount').textContent = cntImgs.length;
            $('imgNum').textContent = cntImgs.length;
        }
        
        function updateImgPreview() {
            var el = $('imgPreview');
            if(cntImgs.length === 0) {
                el.innerHTML = '<div style="font-size:10px;color:#999;padding:5px;">暂无图片</div>';
                return;
            }
            var html = '';
            cntImgs.forEach(function(src, i) {
                html += '<div class="img-preview-item"><img src="' + src + '"></div>';
            });
            el.innerHTML = html;
        }
        
        function onInput() {
            updateStats();
            render();
        }
        
        function updateSum() {
            $('sumDoc').textContent = docName || '-';
            $('sumChar').textContent = $('content').value.length;
            $('sumImg').textContent = cntImgs.length;
        }
        
        function render() {
            var main = $('mainColor').value;
            var danger = $('dangerColor').value;
            var title = $('docTitle').value || '产品手册';
            var showHeader = $('showHeader').checked;
            var showFooter = $('showFooter').checked;
            var text = $('content').value;
            
            if(!text.trim()) {
                $('preview').innerHTML = '<div style="text-align:center;padding:40mm;color:#999;">请导入文档</div>';
                $('badge').textContent = '待导入';
                return;
            }
            
            var lines = text.split('\n');
            var h = '';
            
            // 封面
            h += '<div style="text-align:center;padding:15mm;border-bottom:2px solid ' + main + ';margin-bottom:5mm;">';
            h += '<h1 style="font-size:18pt;color:' + main + ';">' + title + '</h1>';
            h += '</div>';
            
            h += '<div style="padding:5mm;">';
            
            lines.forEach(function(line) {
                line = line.trim();
                if(!line) return;
                
                if(line.match(/^#+\s/)) {
                    var level = line.match(/^#+/)[0].length;
                    var titleText = line.replace(/^#+\s/, '');
                    var sizes = ['14pt', '12pt', '10pt'];
                    h += '<h' + Math.min(level, 3) + ' style="font-size:' + sizes[Math.min(level-1, 2)] + ';color:' + main + ';border-bottom:1px solid ' + main + ';padding-bottom:2mm;margin:5mm 0 3mm;">' + titleText + '</h' + Math.min(level, 3) + '>';
                }
                else if(line.match(/^【危险】/) || line.match(/^DANGER/i)) {
                    h += '<div style="border-left:3mm solid ' + danger + ';background:#fee2e2;padding:3mm 5mm;margin:3mm 0;"><strong style="color:' + danger + ';">⚠️ 危险</strong>: ' + line.replace(/^【危险】\s*/, '').replace(/^DANGER:?\s*/i, '') + '</div>';
                }
                else if(line.match(/^【警告】/) || line.match(/^WARNING/i)) {
                    h += '<div style="border-left:3mm solid #ffc107;background:#fef3c7;padding:3mm 5mm;margin:3mm 0;"><strong style="color:#92400e;">⚠️ 警告</strong>: ' + line.replace(/^【警告】\s*/, '').replace(/^WARNING:?\s*/i, '') + '</div>';
                }
                else if(line.match(/^[-*•]\s/)) {
                    h += '<li style="margin:1mm 0 1mm 5mm;">' + line.replace(/^[-*•]\s/, '') + '</li>';
                }
                else if(line.match(/\[图片(\d+)\]/)) {
                    var idx = parseInt(line.match(/\[图片(\d+)\]/)[1]) - 1;
                    if(cntImgs[idx]) {
                        h += '<div style="text-align:center;margin:3mm 0;"><img src="' + cntImgs[idx] + '" style="max-width:90%;max-height:100px;"></div>';
                    }
                }
                else {
                    h += '<p style="margin:2mm 0;line-height:1.4;">' + line + '</p>';
                }
            });
            
            h += '</div>';
            
            if(showFooter) {
                h += '<div style="border-top:1px solid #ddd;padding-top:2mm;margin-top:5mm;font-size:8pt;color:#666;text-align:center;">产品手册</div>';
            }
            
            $('preview').innerHTML = h;
            $('badge').textContent = docName || '已编辑';
        }
        
        function printPDF() {
            var w = window.open('', '_blank');
            w.document.write('<html><head><title>' + $('docTitle').value + '</title><style>@page{size:A4;margin:10mm}body{font-family:"Microsoft YaHei",Arial;}</style></head><body>' + $('preview').innerHTML + '</body></html>');
            w.document.close();
            w.print();
        }
        
        function saveHTML() {
            var title = $('docTitle').value;
            var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + title + '</title><style>body{font-family:"Microsoft YaHei",Arial;max-width:800px;margin:0 auto;padding:20px;}</style></head><body>' + $('preview').innerHTML + '</body></html>';
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
            a.download = title + '.html';
            a.click();
        }
        
        function saveToFeishu() {
            alert('保存到飞书功能需要配置 API，请联系管理员');
        }
    </script>
</body>
</html>
