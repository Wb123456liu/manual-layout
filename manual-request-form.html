<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 产品手册排版系统 - 需求提交</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .form-body {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
        }
        
        .section-title .icon {
            margin-right: 10px;
            font-size: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        
        .form-group label .required {
            color: #e74c3c;
            margin-left: 4px;
        }
        
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .checkbox-item:hover {
            background: #e9ecef;
        }
        
        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            cursor: pointer;
            font-size: 14px;
            color: #555;
            margin: 0;
        }
        
        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 30px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .success-message {
            display: none;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .file-info {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            color: #004085;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 AI 产品手册排版系统</h1>
            <p>标准化需求提交表单（本地运行版）</p>
        </div>
        
        <div class="form-body">
            <form id="manualRequestForm">
                <!-- 产品信息 -->
                <div class="section">
                    <div class="section-title">
                        <span class="icon">📦</span>
                        产品信息
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product_name">产品名称 <span class="required">*</span></label>
                            <input type="text" id="product_name" name="product_name" required placeholder="例如：EVlink Pro DC 180 充电站">
                        </div>
                        
                        <div class="form-group">
                            <label for="product_model">产品型号 <span class="required">*</span></label>
                            <input type="text" id="product_model" name="product_model" required placeholder="例如：GEX4301000">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="product_version">产品版本</label>
                        <input type="text" id="product_version" name="product_version" placeholder="例如：v1.0" value="v1.0">
                    </div>
                </div>
                
                <!-- 分类配置 -->
                <div class="section">
                    <div class="section-title">
                        <span class="icon">⚙️</span>
                        分类配置
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="region">销售区域 <span class="required">*</span></label>
                            <select id="region" name="region" required>
                                <option value="">请选择区域</option>
                                <option value="CN">中国大陆</option>
                                <option value="EU">欧洲</option>
                                <option value="US">北美</option>
                                <option value="SEA">东南亚</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="product_type">产品类型 <span class="required">*</span></label>
                            <select id="product_type" name="product_type" required>
                                <option value="">请选择产品类型</option>
                                <option value="AC">交流充电桩</option>
                                <option value="DC">直流充电桩</option>
                                <option value="HS">户用储能</option>
                                <option value="PCS">储能变流器</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="manual_type">手册类型 <span class="required">*</span></label>
                            <select id="manual_type" name="manual_type" required>
                                <option value="">请选择手册类型</option>
                                <option value="UM">用户手册 (User Manual)</option>
                                <option value="IM">安装手册 (Installation Manual)</option>
                                <option value="MM">维护手册 (Maintenance Manual)</option>
                                <option value="DS">技术规格书 (Data Sheet)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="priority">优先级</label>
                            <select id="priority" name="priority">
                                <option value="normal">普通</option>
                                <option value="high">加急</option>
                                <option value="urgent">特急</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- 输出要求 -->
                <div class="section">
                    <div class="section-title">
                        <span class="icon">📄</span>
                        输出要求
                    </div>
                    
                    <div class="form-group">
                        <label>输出格式 <span class="required">*</span></label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="output_pdf_print" name="output_pdf_print" checked>
                                <label for="output_pdf_print">PDF 打印版 (300DPI, CMYK)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="output_pdf_web" name="output_pdf_web" checked>
                                <label for="output_pdf_web">PDF 浏览版 (72DPI, RGB)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="output_idml" name="output_idml" checked>
                                <label for="output_idml">InDesign IDML (可编辑)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="output_html" name="output_html">
                                <label for="output_html">HTML (预览用)</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="language">语言版本</label>
                        <select id="language" name="language">
                            <option value="auto">自动匹配（根据销售区域）</option>
                            <option value="zh-CN">中文</option>
                            <option value="en">英文</option>
                            <option value="multi">多语言对照</option>
                        </select>
                    </div>
                </div>
                
                <!-- 原始文档 -->
                <div class="section">
                    <div class="section-title">
                        <span class="icon">📁</span>
                        原始文档
                    </div>
                    
                    <div class="form-group">
                        <label for="source_type">文档来源</label>
                        <select id="source_type" name="source_type">
                            <option value="feishu">飞书云盘链接</option>
                            <option value="feishu_doc">飞书文档链接</option>
                            <option value="local">本地文件（稍后上传）</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="link_group">
                        <label for="source_link">文档链接</label>
                        <input type="url" id="source_link" name="source_link" placeholder="https://...">
                        <div class="help-text">飞书云盘或文档链接</div>
                    </div>
                </div>
                
                <!-- 特殊要求 -->
                <div class="section">
                    <div class="section-title">
                        <span class="icon">⭐</span>
                        特殊要求
                    </div>
                    
                    <div class="form-group">
                        <label>必需内容</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="need_cover" name="need_cover" checked>
                                <label for="need_cover">封面设计</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="need_toc" name="need_toc" checked>
                                <label for="need_toc">目录生成</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="need_safety" name="need_safety" checked>
                                <label for="need_safety">安全标识</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="need_legal" name="need_legal" checked>
                                <label for="need_legal">法律信息页</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="special_requirements">其他要求</label>
                        <textarea id="special_requirements" name="special_requirements" placeholder="请描述您的特殊要求，例如：
- 需要参考特定模板
- 有品牌 VI 规范
- 需要包含特定章节
- 其他说明..."></textarea>
                    </div>
                </div>
                
                <!-- 联系人 -->
                <div class="section">
                    <div class="section-title">
                        <span class="icon">👤</span>
                        联系人信息
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contact_name">姓名 <span class="required">*</span></label>
                            <input type="text" id="contact_name" name="contact_name" required placeholder="你的姓名">
                        </div>
                        
                        <div class="form-group">
                            <label for="contact_email">邮箱 <span class="required">*</span></label>
                            <input type="email" id="contact_email" name="contact_email" required placeholder="your@email.com">
                        </div>
                    </div>
                </div>
                
                <!-- 提交按钮 -->
                <button type="submit" class="submit-btn">🚀 提交排版需求</button>
                
                <!-- 成功消息 -->
                <div id="success_message" class="success-message">
                    <strong>✅ 提交成功！</strong>
                    <p>您的需求已保存为 JSON 文件，可直接用于 AI 排版系统。</p>
                    <p>Request ID: <span id="request_id"></span></p>
                    <p>预计完成时间：<span id="estimated_time"></span></p>
                    <div class="file-info">
                        📄 文件已下载：<strong id="download_filename"></strong><br>
                        <small>下一步：将此文件发送给 AI 排版系统进行处理</small>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 文档来源切换
        document.getElementById('source_type').addEventListener('change', function() {
            const linkGroup = document.getElementById('link_group');
            const sourceLink = document.getElementById('source_link');
            
            if (this.value === 'local') {
                linkGroup.style.display = 'none';
                sourceLink.required = false;
            } else {
                linkGroup.style.display = 'block';
                sourceLink.required = true;
            }
        });
        
        // 表单提交
        document.getElementById('manualRequestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const requestData = {
                request_id: 'REQ-' + Date.now(),
                timestamp: new Date().toISOString(),
                product: {
                    name: formData.get('product_name'),
                    model: formData.get('product_model'),
                    version: formData.get('product_version') || 'v1.0'
                },
                classification: {
                    region: formData.get('region'),
                    product_type: formData.get('product_type'),
                    manual_type: formData.get('manual_type'),
                    config_id: `${formData.get('region')}_${formData.get('product_type')}_${formData.get('manual_type')}`
                },
                output: {
                    formats: [],
                    language: formData.get('language')
                },
                source: {
                    type: formData.get('source_type'),
                    link: formData.get('source_link') || null
                },
                requirements: {
                    cover: formData.get('need_cover') === 'on',
                    toc: formData.get('need_toc') === 'on',
                    safety: formData.get('need_safety') === 'on',
                    legal: formData.get('need_legal') === 'on',
                    special: formData.get('special_requirements')
                },
                contact: {
                    name: formData.get('contact_name'),
                    email: formData.get('contact_email')
                },
                priority: formData.get('priority') || 'normal'
            };
            
            // 添加输出格式
            if (formData.get('output_pdf_print') === 'on') requestData.output.formats.push('PDF_Print');
            if (formData.get('output_pdf_web') === 'on') requestData.output.formats.push('PDF_Web');
            if (formData.get('output_idml') === 'on') requestData.output.formats.push('IDML');
            if (formData.get('output_html') === 'on') requestData.output.formats.push('HTML');
            
            console.log('提交的需求数据:', requestData);
            
            // 本地运行模式：保存为 JSON 文件下载
            const blob = new Blob([JSON.stringify(requestData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${requestData.request_id}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // 显示成功消息
            setTimeout(() => {
                document.getElementById('success_message').style.display = 'block';
                document.getElementById('request_id').textContent = requestData.request_id;
                document.getElementById('download_filename').textContent = `${requestData.request_id}.json`;
                
                const estimatedTime = new Date(Date.now() + 2 * 60 * 60 * 1000);
                document.getElementById('estimated_time').textContent = estimatedTime.toLocaleString('zh-CN');
                
                document.querySelector('.submit-btn').style.display = 'none';
                window.scrollTo(0, document.body.scrollHeight);
            }, 500);
        });
    </script>
</body>
</html>
